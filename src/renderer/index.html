<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>观澜</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="book">

  <!-- 侧栏 -->
  <aside class="sidebar">
    <div class="brand">
      观澜
      <small>GUANLAN · LEDGER</small>
      <div class="rule"></div>
    </div>

    <nav>
      <a class="on" data-view="ledger"><span class="dot"></span>账簿</a>
      <a data-view="add"><span class="dot"></span>记一笔</a>
      <a data-view="list"><span class="dot"></span>流水</a>
      <a data-view="report"><span class="dot"></span>财报</a>
    </nav>

    <div class="side-foot">
      <div class="seal" id="seal">丙午年拾月</div>
    </div>
  </aside>

  <!-- 主区 -->
  <main>

    <!-- 示例数据提示 -->
    <div class="notice" id="notice" hidden>
      <span>当前显示的是示例数据，方便你先看看样子。</span>
      <button id="btn-clear-demo">清空示例，开始记我自己的账</button>
    </div>

    <!-- 账簿 -->
    <section id="view-ledger">
      <div class="head">
        <div>
          <h1>个人账簿</h1>
          <div class="sub" id="ledger-sub">本月</div>
        </div>
        <div class="date" id="today"></div>
      </div>

      <div class="trio">
        <div class="cell">
          <div class="k">净 资 产</div>
          <div class="v" id="networth">—</div>
          <div class="n" id="networth-note"></div>
        </div>
        <div class="cell">
          <div class="k">生 存 月 数</div>
          <div class="v" id="runway">—</div>
          <div class="n">流动资产 ÷ 月支出</div>
        </div>
        <div class="cell">
          <div class="k">负 债 率</div>
          <div class="v" id="debt">—</div>
          <div class="n" id="debt-note"></div>
        </div>
      </div>

      <div class="gains-line" id="gains-line" hidden>
        <span class="k">本 月 换 来 了</span>
        <span class="v" id="gains-text"></span>
      </div>

      <div class="quote" id="quote" hidden>
        <svg class="art" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round" style="color:#8C8477">
          <path d="M32 54V26"/>
          <path d="M32 34c0-9-7-13-15-13 0 9 6 13 15 13z"/>
          <path d="M32 26c0-9 7-13 15-13 0 9-6 13-15 13z"/>
          <path d="M22 54h20"/>
          <path d="M18 48c4 2 10 3 14 3s10-1 14-3"/>
        </svg>
        <div class="body">
          <div class="t" id="q-text"></div>
          <div class="s" id="q-src"></div>
        </div>
      </div>

      <div class="sec-title">
        <h2>最 近 记 录</h2>
        <div class="line"></div>
        <div class="stamp" id="days-stamp">—</div>
      </div>

      <div class="rows" id="recent-rows"></div>
    </section>

    <!-- 记一笔 -->
    <section id="view-add" hidden>
      <div class="head">
        <div>
          <h1>记一笔</h1>
          <div class="sub">写一句话，或者直接填</div>
        </div>
        <div class="date" id="add-time"></div>
      </div>

      <div class="add-wrap">
        <input class="nl-input" id="nl-input" autocomplete="off" placeholder="午饭25">

        <div class="parse" id="parse-row">
          <span class="chip k">解 析</span>
        </div>

        <div class="form" id="add-form">

          <div class="f-row">
            <label>类型</label>
            <div class="seg" id="seg-kind">
              <button type="button" data-kind="expense" class="on">支出</button>
              <button type="button" data-kind="income">收入</button>
              <button type="button" data-kind="transfer">转账</button>
            </div>
          </div>

          <div class="f-row">
            <label>金额</label>
            <div class="f-amt">
              <span class="cur">¥</span>
              <input id="f-amount" inputmode="decimal" autocomplete="off">
            </div>
          </div>

          <div class="f-row" id="row-cat">
            <label>分类</label>
            <select id="f-cat" class="f-input"></select>
          </div>

          <div class="f-row" id="row-acc">
            <label id="lbl-acc">账户</label>
            <select id="f-acc" class="f-input"></select>
          </div>

          <div class="f-row" id="row-to">
            <label>转入</label>
            <select id="f-to" class="f-input"></select>
          </div>

          <div class="f-row">
            <label>日期</label>
            <div class="seg seg-sm" id="seg-date">
              <button type="button" data-d="0" class="on">今天</button>
              <button type="button" data-d="1">昨天</button>
              <button type="button" data-d="2">前天</button>
            </div>
            <input type="date" id="f-date" class="f-input f-date">
          </div>

          <div class="f-row">
            <label>备注</label>
            <input id="f-note" class="f-input" autocomplete="off" placeholder="可以不填">
          </div>

        </div>

        <div class="add-actions">
          <button class="btn" id="btn-add">记 下</button>
          <span class="msg" id="msg"></span>
        </div>

        <!-- 回执：记完之后跟人说的那句话 -->
        <div class="receipt" id="receipt" hidden>
          <div class="r-top">
            <span class="r-badge" id="r-badge"></span>
            <span class="r-amt" id="r-amt"></span>
          </div>
          <div class="r-kicker" id="r-kicker" hidden>换 来 了</div>
          <div class="r-title" id="r-title" hidden></div>
          <div class="r-body" id="r-body"></div>
        </div>

        <div class="sec-title" id="recent-add-title" hidden>
          <h2>刚 记 下 的</h2>
          <div class="line"></div>
          <button class="link" id="btn-goto-ledger">回账簿</button>
        </div>
        <div class="rows" id="recent-add" hidden></div>

        <div class="hint">
          <code>午饭25</code>记 25 元餐饮　<code>工资8500</code>记工资收入<br>
          <code>买书89</code>归入成长　<code>还信用卡600</code>转账，不影响收支<br>
          输入框里打回车即可提交，记完留在本页，可以接着记下一笔。
        </div>
      </div>
    </section>

    <!-- 流水 -->
    <section id="view-list" hidden>
      <div class="head">
        <div>
          <h1>流水</h1>
          <div class="sub" id="list-sub"></div>
        </div>
        <div class="date" id="list-sum"></div>
      </div>
      <div class="rows" id="all-rows"></div>
    </section>

    <!-- 财报 -->
    <section id="view-report" hidden>
      <div class="head">
        <div>
          <h1>月度财报</h1>
          <div class="sub" id="report-sub"></div>
        </div>
        <div class="rpt-tools">
          <button id="m-prev" title="上个月">‹</button>
          <span id="m-label">—</span>
          <button id="m-next" title="下个月">›</button>
          <button id="btn-print">打 印</button>
        </div>
      </div>
      <div id="report-body"></div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
